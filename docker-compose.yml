services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fxpay
      POSTGRES_USER: fxpay
      POSTGRES_PASSWORD: fxpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxpay -d fxpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment: &app_env
      DJANGO_SETTINGS_MODULE: fxpay.settings
      DJANGO_SECRET_KEY: dev-only-change-me-in-p1-04
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fxpay
      POSTGRES_USER: fxpay
      POSTGRES_PASSWORD: fxpay
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: .
    command: celery -A fxpay worker -l info
    volumes:
      - .:/app
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
